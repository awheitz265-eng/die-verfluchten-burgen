function updateErrand(g,dt){
 const w=g.world;if(w.inside)return;
 const post=w.marks?.[0]||w.sign;
 if(!post||!(post.done||w.signRead))return;
 let q=w.errand;
 if(!q){
  const kind=errands[(w.chapter-1)%3];
  q=w.errand={kind,progress:0,done:false,x:post.x,y:post.y};
  g.notify(starts[kind]);
 }
 if(q.done)return;
 const p=g.player;
 if(q.kind==='beacon'){
  const atPost=Math.hypot(p.x-post.x,p.y-post.y)<=2.3;
  q.progress=atPost?Math.min(4,q.progress+dt):0;
  if(q.progress<4)return;

  q.progress=Math.min(2,w.chests.filter(c=>c.opened).length);
  if(q.progress<Math.min(2,w.chests.length)||!w.chests.length)return;
 }else{
  const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);
  if(d>1){const step=Math.min(d-.85,dt*4.6);q.x+=step*dx/d;q.y+=step*dy/d;}
  if(Math.hypot(q.x-w.exit.x,q.y-w.exit.y)>3.1)return;
 }
 q.done=true;
 const gold=8+w.chapter*2;p.gold+=gold;
 g.notify(({beacon:'Das Signalfeuer brennt!',satchel:'Die Botenpost ist vollständig!',moth:'Die Motte leuchtet über dem Tor!'})[q.kind]+' +'+gold+' Gold');
 g.emit('quest');g.persist();
}

// animation
// Rendering-only animation selection; combat timings remain authoritative.
// Walk cycles are driven by the distance actually covered (STRIDE frames per tile), so feet do not slide.
const STRIDE=4.8;
function heroFrame(player,stats,input,time){
 const prefix='hero-'+(stats.kind||'sword');
 if(player.guardImpact>0)return prefix+'-guardhit-'+Math.min(2,Math.floor((.18-player.guardImpact)/.06));
 if(player.hurt>0)return prefix+'-hit-'+Math.min(2,Math.floor((.22-player.hurt)/.08));
 if(input.block&&stats.kind!=='bow')return prefix+'-block-0';
 // Damage happens when the input fires: begin with the contact pose, then recover.
 if(player.cooldown>0){const progress=1-player.cooldown/stats.weapon.cooldown;if(input.attack&&progress>.72)return prefix+'-attack-'+Math.min(3,Math.floor((progress-.72)/.28*4));
 return prefix+'-attack-'+Math.min(7,4+Math.floor(progress*5));}
 return prefix+(player.moving?'-walk-'+(Math.floor((player.step||0)*STRIDE)%12):'-idle-'+(Math.floor(time*4)%8));
}
function enemyFrame(enemy,time,moving,step){
 const prefix=enemy.type;
 if(enemy.type==='boss0'&&enemy.atk==='charge'&&(enemy.state==='windup'||enemy.state==='charge'))return 'boss0-brace-'+(enemy.state==='charge'?3:Math.min(2,Math.max(0,Math.floor(3*(1-enemy.timer/enemy.windup)))));
 if(enemy.type==='boss0'&&enemy.exposed>0)return 'boss0-break-'+Math.min(3,Math.max(0,Math.floor((1-enemy.exposed/enemy.recoverTotal)*4)));
 if(enemy.hit>0)return prefix+'-hit-'+Math.min(2,Math.floor((.16-enemy.hit)/.054));
 if(enemy.state==='windup'){const duration=enemy.windup||(enemy.boss?1.15:['archer','mage'].includes(enemy.type)?.7:enemy.type==='knight'?.95:.55);return prefix+'-attack-'+Math.min(3,Math.max(0,Math.floor((1-enemy.timer/duration)*4)));}
 if(enemy.state==='recover'){const total=enemy.recoverTotal||(enemy.boss?1.6:enemy.type==='knight'?1.8:1.1),elapsed=total-enemy.cooldown;if(elapsed<.32)return prefix+'-attack-'+Math.min(7,4+Math.max(0,Math.floor(elapsed/.08)));}
 if(enemy.state==='charge'||enemy.state==='leap')return prefix+'-attack-4';
 if(enemy.state==='channel')return prefix+'-attack-'+(3+Math.floor(time*8)%2);
 const walk=step===undefined?Math.floor(time*15+enemy.x*2):Math.floor(step*STRIDE);
 return prefix+(moving?'-walk-'+(walk%12):'-idle-'+(Math.floor(time*4+enemy.x*3)%8));
}
// Death: 6 collapse frames over .42 s, then the renderer tips the last frame over and fades it.
function deathFrame(enemy,since){return enemy.type+'-die-'+Math.min(5,Math.floor(since/.07));}

// Enemy and boss behaviour. Ordinary enemies and bosses share one set of attack ids:
//   melee, cone, volley, nova, slam, charge, spiral, summon, blink, leap, rain.
// Every attack has a telegraph (e.tele) during its windup so the player can read it and dodge.

function aiMinions(g){return g.world.enemies.filter(m=>m.minion&&!m.dead).length;}
function aiFinish(e,cooldown,g){cooldown*=g?g.diff.cd:1;e.state='recover';e.recoverTotal=cooldown;e.cooldown=cooldown;e.tele=null;}
// Aim where the player will be: lead 0 aims at the current position, 1 fully predicts straight movement.
function aiAim(g,e,speed){const p=g.player,lead=g.diff.lead;if(!lead||!speed)return Math.atan2(p.y-e.y,p.x-e.x);const t=Math.min(1.2,Math.hypot(p.x-e.x,p.y-e.y)/speed)*lead;return Math.atan2(p.y+(p.vy||0)*t-e.y,p.x+(p.vx||0)*t-e.x);}
function aiLaunch(g,e,id,params){
 const p=g.player;
 e.state='windup';e.atk=id;e.atkp=params;e.timer=e.windup=Math.max(.2,params.windup*(e.elite?.88:1)*g.diff.wind);e.chain=params.chain||0;
 e.tx=p.x;e.ty=p.y;e.aim=Math.atan2(p.y-e.y,p.x-e.x);
 AI_ATTACKS[id].start(g,e,p);
 g.emit('enemyattack',{boss:e.boss,id});
}
function attackLines(e,offsets,angle=e.aim){
 const dx=Math.cos(angle),dy=Math.sin(angle);
 return offsets.map(side=>({k:'line',x:e.x-dy*side,y:e.y+dx*side,x2:e.x+dx*12-dy*side,y2:e.y+dy*12+dx*side,w:.75}));
}
function strikesLine(line,p){
 const dx=line.x2-line.x,dy=line.y2-line.y,t=((p.x-line.x)*dx+(p.y-line.y)*dy)/(dx*dx+dy*dy);
 return t>=0&&t<=1&&Math.hypot(p.x-line.x-t*dx,p.y-line.y-t*dy)<line.w+.2;
}
function resolveLines(g,e,p,lines){
 const hit=lines.some(l=>strikesLine(l,p)&&lineOfSight(g.world,{x:l.x,y:l.y},p));
 for(const l of lines)g.fx('shock',l.x2,l.y2,AI_BOSS_COLOR[aiBossIndex(e)],.45,{range:1.2});
 return hit;
}

 charge:{
  start(g,e,p){const q=e.atkp,a=Math.atan2(p.y-e.y,p.x-e.x);e.cdx=Math.cos(a);e.cdy=Math.sin(a);e.tele=[{k:'line',x:e.x,y:e.y,x2:e.x+e.cdx*q.len,y2:e.y+e.cdy*q.len,w:.9}];},

   e.blinkTarget=spot;e.tele=[{k:'c',x:e.x,y:e.y,r:1.2,soft:true}];if(spot)e.tele.push({k:'c',...spot,r:1.2});},

function aiResolve(g,e,p){
 const tele=e.tele;e.tele=null;
 const result=AI_ATTACKS[e.atk].fire(g,e,p,tele);
 if(result==='keep')return;
 if(e.chain>0){aiLaunch(g,e,e.atk,{...e.atkp,windup:e.atkp.windup*.55,chain:e.chain-1});return;}
 aiFinish(e,e.boss?(e.phase?.8:1.1):AI_COOLDOWN[e.type]*Math.max(.6,1-.035*(g.state.chapter-1)),g);
}
function aiBossPick(g,e,d){
 const def=BOSSES[aiBossIndex(e)];
 const finalKits=[['charge','sweep','slam'],['spiral','leap','summon'],['rain','nova','charge','spiral']];
 const kit=e.type==='boss5'&&g.world.campaign?finalKits[e.phase]:[...def.kit,...(e.phase>0?def.kit2:[])];
 const ok=id=>{const r=AI_BOSS_RANGE[id];return d>=r[0]&&d<=r[1]&&(id!=='summon'||aiMinions(g)<4)&&(id!=='ward'||!g.world.enemies.some(m=>m.root&&!m.dead));};
 let pool=kit.filter(id=>ok(id)&&id!==e.last);if(!pool.length)pool=kit.filter(ok);if(!pool.length)return null;
 return pool[Math.floor(g.random()*pool.length)];
}
function aiPhase(g,e){
 const ratio=e.hp/e.maxHp,phase=e.type==='boss5'?(ratio<.33?2:ratio<.66?1:0):(ratio<.5?1:0);
 if(phase>e.phase){e.phase=phase;e.speed*=1.1;e.cooldown=Math.min(e.cooldown,.6);g.notify(BOSSES[aiBossIndex(e)].name+' gerät in Raserei!');g.fx('shock',e.x,e.y,'#ff9a5a',.8,{range:4});g.emit('slam');}
}
function aiChoose(g,e,p,d){
 const ch=g.state.chapter,t=e.type;
 if(e.boss){const id=aiBossPick(g,e,d);if(!id)return false;aiLaunch(g,e,AI_BOSS_ATTACK[id]||id,AI_BOSS_PARAMS[id](e));e.last=id;return true;}
 if(e.variant==='sharpshooter'&&d>3&&d<=9){aiLaunch(g,e,'snipe',{windup:1.05});return true;}
 if(e.variant==='drummer'&&d<7&&(e.rallyCd||0)<=0&&g.world.enemies.some(a=>a!==e&&!a.dead&&!a.boss&&Math.hypot(a.x-e.x,a.y-e.y)<3.8)){
  e.rallyCd=7;aiLaunch(g,e,'rally',{windup:.8});return true;
 }
 switch(t){
  case 'bandit':if(d>1.5)return false;aiLaunch(g,e,'melee',{windup:.5,r:1.15,mult:1,kb:.3,chain:ch>=2?1:0});return true;
  case 'skeleton':if(d>1.5)return false;aiLaunch(g,e,'melee',{windup:.42,r:1.15,mult:.9,kb:.2,chain:1});return true;
  case 'knight':if(d>1.8)return false;if(g.random()<.35)aiLaunch(g,e,'melee',{windup:.5,r:1.35,mult:.7,kb:1.4,chain:0});else aiLaunch(g,e,'melee',{windup:.95,r:1.6,mult:1.05,kb:.9,chain:0});return true;
  case 'brute':if(d<2.4){aiLaunch(g,e,'slam',{windup:1,r:2.2,mult:1.15,kb:1.3,self:true});return true;}if(d>3&&d<7.5&&g.random()<.45){aiLaunch(g,e,'charge',{windup:.85,len:7,speed:8,dur:.6,mult:1.2,kb:1.4});return true;}return false;
  case 'assassin':if(d>6.5||d<.6)return false;aiLaunch(g,e,'charge',{windup:.38,len:Math.min(5,d+1.2),speed:15,dur:.3,mult:1,kb:.4});e.flee=1;return true;
  case 'archer':if(d>9)return false;aiLaunch(g,e,'volley',{windup:.65,n:ch>=2?3:1,spread:.17,speed:7,color:'#dfbe8c',mult:1});return true;
  case 'mage':if(d<2.6&&(e.blinkCd||0)<=0){e.blinkCd=5.5;aiLaunch(g,e,'blink',{windup:.3,away:true});return true;}if(d>9)return false;aiLaunch(g,e,'volley',{windup:.7,n:ch>=3?3:1,spread:.17,speed:5,color:'#a6b3f3',mult:ch>=3?.8:1});return true;
  case 'cultist':if(d>10)return false;if((e.summonCd||0)<=0&&aiMinions(g)<4){e.summonCd=10;aiLaunch(g,e,'summon',{windup:1.1,types:['skeleton'],n:2,max:4});return true;}if(d>9)return false;aiLaunch(g,e,'volley',{windup:.8,n:3,spread:.3,speed:3.8,color:'#c778e8',mult:.75});return true;
 }
 return false;
}
function updateEnemies(g,dt){
 const w=g.world,p=g.player;
 for(const e of w.enemies){
  if(e.dead||e.root||(e.boss&&w.seal&&!w.unsealed))continue;
  if(e.variant===undefined){
   const special=g.state.chapter>=3&&!e.minion&&(Math.floor(e.homeX)+Math.floor(e.homeY))%2===0;
   e.variant=special&&e.type==='archer'?'sharpshooter':special&&e.type==='skeleton'?'drummer':'';
  }
  if(e.rallyCd>0)e.rallyCd-=dt;
  e.hit=Math.max(0,e.hit-dt);if(e.exposed>0)e.exposed=Math.max(0,e.exposed-dt);e.cooldown-=dt;if(e.blinkCd>0)e.blinkCd-=dt;if(e.summonCd>0)e.summonCd-=dt;
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy),t=e.type;
  e.fx=dx/(d||1);e.fy=dy/(d||1);
  if(e.boss)aiPhase(g,e);
  if(d>(e.boss?16:e.minion?60:g.diff.sense)){e.state='patrol';e.tele=null;if(Math.sin(g.time*.4+e.homeX)>0){move(w,e,Math.sin(e.homeX+g.time*.25)*dt*.2,Math.cos(e.homeY+g.time*.25)*dt*.2);}continue;}
  if(e.state==='windup'){e.timer-=dt;if(e.timer<=0)aiResolve(g,e,p);continue;}
  if(e.state==='charge'){
   const q=e.atkp,before={x:e.x,y:e.y};move(w,e,e.cdx*q.speed*dt,e.cdy*q.speed*dt);e.timer-=dt;
   if(!e.chit&&Math.hypot(p.x-e.x,p.y-e.y)<.85+e.radius){e.chit=true;g.damagePlayer(e.damage*q.mult,e,q.kb||0);}
   const moved=Math.hypot(e.x-before.x,e.y-before.y),blocked=moved<q.speed*dt*.3;
   if(e.timer<=0||blocked){if(w.falkenstein&&e.type==='boss0'&&!e.chit){
     aiFinish(e,blocked?2.4:1.65,g);e.exposed=e.cooldown;
     g.fx('text',e.x,e.y,'#ffe4a0',1,{text:'Deckung offen'});
     g.fx('shock',e.x,e.y,'#d9bd80',.4,{range:1.5});continue;
    }if(blocked&&e.boss){g.fx('shock',e.x,e.y,'#c9b79a',.4,{range:1.6});g.emit('slam');}aiFinish(e,blocked&&e.boss?2.4:e.boss?1.6:1.5,g);}
   continue;
  }
  if(e.state==='channel'){
   const q=e.atkp;e.timer-=dt;e.shot-=dt;
   while(e.shot<=0){e.shot+=q.rate;e.ang+=.5;for(let k=0;k<q.arms;k++){const a=e.ang+k*Math.PI*2/q.arms;g.shoot(e,{x:Math.cos(a),y:Math.sin(a)},e.damage*q.mult,'enemy',q.speed,q.color||'#8fd0ff');}}
   if(e.timer<=0)aiFinish(e,.9,g);
   continue;

 knownTerrain(w,p){

function stickVector(dx,dy,radius=46){
 const distance=Math.hypot(dx,dy),scale=Math.min(1,radius/(distance||1));
 return {x:distance<9?0:dx/(distance||1),y:distance<9?0:dy/(distance||1),knobX:dx*scale,knobY:dy*scale};
}
function touchAim(game,movement){
 const p=game.player,w=game.world;
 if(game.stats.kind==='bow'){
  const dir=Math.hypot(movement.x,movement.y)>.05?movement:p.face,n=Math.hypot(dir.x,dir.y)||1;
  const e=selectBowTarget(game,(_,dx,dy,d)=>d*(1+.65*(1-(dx*dir.x+dy*dir.y)/(d*n))));
  return e?bowDirection(w,p,e):dir;
 }
 const range=3.2;
 const target=w.enemies.filter(e=>!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<=range&&lineOfSight(w,p,e)).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
 if(target)return {x:target.x-p.x,y:target.y-p.y};
 return Math.hypot(movement.x,movement.y)>.01?movement:p.face;
}
class TouchControls{
 constructor(game,audio){
  this.game=game;this.audio=audio;this.vector={x:0,y:0};this.pointers=new Map();this.stickId=null;this.attack=false;this.block=false;this.tick=0;
  let preference=null;try{preference=localStorage.getItem('burgen-touch');}catch{}
  this.enabled=preference===null?(navigator.maxTouchPoints>0||matchMedia('(pointer: coarse)').matches):preference==='on';
  this.root=document.createElement('div');this.root.id='touch-controls';this.root.hidden=true;
  this.root.innerHTML=`<div id="move-stick" role="group" aria-label="Bewegungsstick: ziehen zum Bewegen"><span class="stick-ring"></span><span id="stick-knob"></span><small>BEWEGEN</small></div><div class="touch-actions"><button id="touch-interact" class="touch-interact" aria-label="Interagieren"><span>✦</span><small>Aktion</small></button><button id="touch-dodge" aria-label="Ausweichen"><span>↝</span><small>Rolle</small></button><button id="touch-block" aria-label="Blocken halten"><span>◇</span><small>Block</small></button><button id="touch-attack" class="touch-attack" aria-label="Angreifen halten"><span>⚔</span><small>Angriff</small></button></div><div id="touch-context" aria-live="polite"></div>`;
  document.body.append(this.root);this.stick=document.getElementById('move-stick');this.knob=document.getElementById('stick-knob');this.buttons=Object.fromEntries(['attack','block','dodge','interact'].map(a=>[a,document.getElementById('touch-'+a)]));this.context=document.getElementById('touch-context');
  this.stick.addEventListener('pointerdown',e=>{if(!this.enabled||game.mode!=='play'||this.stickId!==null)return;e.preventDefault();this.audio.start();this.stickId=e.pointerId;this.stick.setPointerCapture(e.pointerId);this.move(e);});
  this.stick.addEventListener('pointermove',e=>{if(e.pointerId===this.stickId){e.preventDefault();this.move(e);}});
  for(const event of ['pointerup','pointercancel','lostpointercapture'])this.stick.addEventListener(event,e=>{if(e.pointerId===this.stickId)this.clearStick();});

   for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>this.release(e.pointerId));

  }
  this.root.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('toggle-touch-controls',()=>this.setEnabled(!this.enabled));

 }
 setEnabled(value,persist=true){this.enabled=value;this.game.touchEnabled=value;document.documentElement.classList.toggle('touch-mode',value);if(persist)try{localStorage.setItem('burgen-touch',value?'on':'off');}catch{}this.reset();}

 update(dt){const g=this.game,visible=this.enabled&&g.mode==='play';if(this.root.hidden===visible){this.root.hidden=!visible;if(!visible)this.reset();}if(!visible)return;this.tick+=dt;if(this.tick<.1)return;this.tick=0;const it=g.interaction(),label=it?({gate:'Tor',chest:'Truhe',drop:'Beute',princess:'Befreien',mark:'Spur',sign:'Lesen'}[it.kind]):'Aktion';this.buttons.interact.disabled=!it;this.buttons.interact.querySelector('small').textContent=label;this.buttons.interact.setAttribute('aria-label',it?.label||'Interagieren');this.context.textContent=it?.label||'';this.buttons.dodge.disabled=g.player.stamina<24||g.player.roll>0;this.buttons.block.disabled=g.stats.kind==='bow';}
}

const game=new Game(),audio=new AudioEngine(),renderer=new Renderer(document.getElementById('world'),game),touch=new TouchControls(game,audio),ui=new UI(game,renderer,audio);
const keys=new Set();let pointer={x:innerWidth*.6,y:innerHeight*.5},last=performance.now(),footstep=0,mouseAttack=false,mouseBlock=false;

function blur(){keys.clear();mouseAttack=mouseBlock=false;touch.reset();if(game.mode==='play'){game.mode='pause';game.persist();ui.render();}}

const fpsText=document.getElementById('fps');
let sampleStart=null,sampleFrames=0;
let nextFrame=0,mobileRate=60,slowTime=0,fastTime=0;
function frame(now){
 if(renderer.mobile){const interval=1000/(game.mode==='play'?mobileRate:15);if(now+.5<nextFrame){requestAnimationFrame(frame);return;}nextFrame=now+interval-Math.max(0,(now-nextFrame)%interval);}

  if(sampleStart===null){sampleStart=now;sampleFrames=0;fpsText.textContent='';}
  else if(++sampleFrames&&now-sampleStart>=1000){
   fpsText.textContent=Math.round(sampleFrames*1000/(now-sampleStart))+' FPS';sampleStart=now;sampleFrames=0;
  }
 }else sampleStart=null;
 if(fpsText.hidden===showFps)fpsText.hidden=!showFps;
 const dt=Math.min((now-last)/1000,.2);last=now;touch.update(dt);const sx=(keys.has('d')?1:0)-(keys.has('a')?1:0),sy=(keys.has('s')?1:0)-(keys.has('w')?1:0),keyboard=sx||sy;game.input.x=keyboard?sx+sy:touch.vector.x;game.input.y=keyboard?sy-sx:touch.vector.y;game.input.attack=mouseAttack||touch.attack;game.input.block=mouseBlock||touch.block;if(game.player){if(touch.enabled&&!mouseAttack&&!mouseBlock){if(touch.attack||touch.block)game.input.aim=touchAim(game,touch.vector);else{game.bowTarget=null;game.input.aim=touch.vector.x||touch.vector.y?touch.vector:game.player.face;}}else{game.input.aim=renderer.pointerAim(pointer);}}advanceGame(game,dt);renderer.draw(dt);ui.update(dt);if(game.player?.moving&&game.mode==='play'){footstep+=dt;if(footstep>.32){audio.sound('step',game.world.inside);footstep=0;}}if(renderer.mobile&&game.mode==='play'){
